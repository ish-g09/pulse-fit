spring.application.name=pulse-fit

# Dynamic Database Configuration (Cloud vs Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulsefit_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pulsefit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# LangChain4j Ollama Configuration
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=llama3.2
langchain4j.ollama.chat-model.temperature=0.7